# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Mọi con số do src/lab13.py in ra (mục D1, D3). Số tính từ cột _simulated ghi nhãn [simulated].
# Kiểm tra đọc được (trong src/): python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels cho 1.250).
#   b) Theo nhân viên, m = 75: hệ số thiết kế 1 + 74 × 0,02 = 2,48; 1.251 × 2,48 = 3.103 mỗi nhóm; 42 người mỗi nhóm, tổng 84 > 40 → không đủ người.
#   c) 20 nhân viên mỗi nhóm: hiệu dụng tối đa 20 ÷ 0,02 = 1.000 < 1.251 → không đạt, dù mỗi người xử lý bao nhiêu yêu cầu.
#   d) 6 depot mỗi nhóm: hiệu dụng tối đa 6 ÷ 0,02 = 300 → không đạt, và chỉ có 6 cụm (dưới 20).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: mỗi người ít nhất 299 yêu cầu (hệ số thiết kế 6,96; 298 chỉ được 858,8).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn: theo nhân viên, 20 + 20 (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có; 20 nhân viên đối chứng làm cùng ngày, cùng 12 depot, từ 07/12/2026 đến 03/01/2027.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên; bốc thăm bằng code với seed 20261125 ghi trước, phân tầng theo depot (nên cân cả 6 depot đã chạy thử); yêu cầu được hệ thống ticket chia đều, nhân viên không tự chọn.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro; 20/40 nhân viên đã dùng trợ lý ở đợt chạy thử. Rút quyền nhóm đối chứng từ 30/11, quyền theo tài khoản, log lượt mở theo staff_id, dừng nếu quá 2% (luật 5).
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có; nằm trong file này, chốt bằng commit trước ngày 07/12/2026, ngày quyết định 13/01/2027.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (cách chia đạt "tách được tác động" nhưng chưa đủ mẫu cho 5 điểm):
#   - Chỉ bảo đảm thấy được mức chênh 6 điểm. Nếu tác động thật là 5 điểm thì power chỉ 0,64 (0,66 khi đo đủ 14 ngày), tức khoảng 1/3 khả năng bỏ lỡ.
#   - Không chọn chia theo yêu cầu dù đủ 1.251, vì một người vừa dùng vừa không dùng trợ lý sẽ học cách trả lời, đối chứng không còn sạch.
#   - Phụ thuộc ICC: từ 0,0233 trở lên thì 20 người mỗi nhóm không bao giờ đủ 859. ICC ước lượng từ đợt chạy thử là −0,003 (20 nhân viên), nên 0,02 là giả định thận trọng.
#   - Baseline 0,70 là của mọi loại yêu cầu; riêng phạm vi này chưa có số đối chứng. Chỉ số chính trong đợt chạy thử ở phạm vi là 92,26% (906/982), không có đối chứng nên không so với 0,70.
#     Vì vậy bước 0.10 đo riêng nhóm đối chứng: nếu trên 87% thì mức +5 điểm khó đạt, Giám đốc vận hành phải chốt lại mục tiêu trước 21/12.
#   - Mỗi bước một tuần không đủ: mỗi người chỉ có 30,7 yêu cầu/ngày trong phạm vi, 299 yêu cầu cần 9,7 ngày. Bước 0.50 kéo dài 14 ngày (m = 429, hiệu dụng 897), cộng 8 ngày chờ đóng và mở lại.
#   - Pilot không tiết kiệm tiền khi còn nhỏ: ở bước 0.10 xem lại 100%, chi phí mỗi việc thành công là 12.415 đ, cộng chi phí cố định 11.852 đ thành 24.267 đ = 2,02× [simulated]. Đây là tiền mua thông tin.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   - Hiện tại 4,25% (51/1.200); trong phạm vi 3,97% (39/982): noi_dia 3,16% (26/824), hang_nang 8,23% (13/158). Ngưỡng 1–3% sẽ dừng pilot ngay tuần đầu.
#   - Ngưỡng chọn: cao hơn đối chứng từ 2 điểm, hoặc vượt trần tuyệt đối 6% (khoảng 1,5 lần mức 3,97%).
#   - Kiểm soát thêm: 39/39 ca bị mở lại trong phạm vi đều không được xem lại, còn 9/9 ca sai được xem lại không bị mở lại. Do đó bước 0.10 xem lại 100%,
#     sau đó giảm theo bậc cho noi_dia; hang_nang giữ 100% vì tỉ lệ sai 13,3% (18/135) so với noi_dia 3,7% (30/813). Lỗi lọt dự kiến 0% → 1,5% → 2,3%.
#   - Với ICC 0,02, khả năng chạm ngưỡng "+2 điểm" chỉ do ngẫu nhiên là 11,6% ở bước 0.10, 4,6% ở 0.25, 1,5% ở 0.50. Chấp nhận dừng nhầm ở bước đầu vì chỉ ảnh hưởng 4 nhân viên.

